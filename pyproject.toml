[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-swing"
version = "1.0.0"
description = "Institutional-grade Swing Trading Recommendation Platform for Indian Equities"
requires-python = ">=3.11"
dependencies = [
    # Core
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Database
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    # Data
    "yfinance>=0.2.40",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pandas-ta>=0.3.14b",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    # Scheduling
    "apscheduler>=3.10.4",
    # Config
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    # Logging
    "structlog>=24.1.0",
    "rich>=13.7.0",
    # Performance
    "numba>=0.59.0",
    "scipy>=1.13.0",
    # Reporting
    "jinja2>=3.1.4",
    "openpyxl>=3.1.4",
    # CLI
    "typer>=0.12.3",
    # Utilities
    "tenacity>=8.3.0",
    "cachetools>=5.3.3",
    "diskcache>=5.6.3",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "freezegun>=1.5.0",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
    "pre-commit>=3.7.1",
]

[project.scripts]
swing = "indian_swing.scripts.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["indian_swing*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PTH"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = " -v"

[tool.coverage.run]
source = ["indian_swing"]
omit = ["tests/*", "*/migrations/*"]
